/* Simple built-in background music using Web Audio API.
   No separate music file is needed. */
let audioCtx=null, master=null, musicTimer=null, noteIndex=0;
const melody=[261.63,329.63,392.00,329.63,293.66,349.23,440.00,349.23];
function startMusic(){
  if(!musicOn)return;
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    master=audioCtx.createGain(); master.gain.value=.055; master.connect(audioCtx.destination);
  }
  if(audioCtx.state==="suspended")audioCtx.resume();
  clearInterval(musicTimer);
  noteIndex=0;
  playNote();
  musicTimer=setInterval(playNote,360);
}
function playNote(){
  if(!musicOn||!audioCtx)return;
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.type="triangle";osc.frequency.value=melody[noteIndex++%melody.length];
  gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.7,audioCtx.currentTime+.025);
  gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.30);
  osc.connect(gain);gain.connect(master);osc.start();osc.stop(audioCtx.currentTime+.32);
}
function stopMusic(){clearInterval(musicTimer);if(audioCtx)audioCtx.suspend();}
function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};nextDir={x:1,y:0};score=0;scoreEl.textContent=0;
  placeFood();draw();
}
function placeFood(){
  do food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function circlePhoto(x,y,r){
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
  if(img.complete)ctx.drawImage(img,x-r,y-r,r*2,r*2);
  ctx.restore();
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
}
function draw(){
  ctx.clearRect(0,0,400,400);ctx.fillStyle="#183018";ctx.fillRect(0,0,400,400);
  ctx.strokeStyle="rgba(255,255,255,.05)";
  for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(400,i*cell);ctx.stroke();}
  ctx.font="16px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("🍎",(food.x+.5)*cell,(food.y+.5)*cell);
  snake.slice(1).forEach((s,i)=>{ctx.fillStyle=i%2?"#75c943":"#55ad32";ctx.beginPath();ctx.arc((s.x+.5)*cell,(s.y+.5)*cell,7.7,0,Math.PI*2);ctx.fill();});
  const h=snake[0];circlePhoto((h.x+.5)*cell,(h.y+.5)*cell,9.4);
}
function setDir(d){
  const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}},nd=m[d];
  if(nd.x===-dir.x&&nd.y===-dir.y)return;nextDir=nd;
}
function step(){
  dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return;}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){score++;scoreEl.textContent=score;placeFood();}
  else snake.pop();
  draw();
}
function start(){
  clearInterval(timer);reset();running=true;statusEl.textContent="Playing";startBtn.textContent="🔄 RESTART";
  startMusic();timer=setInterval(step,135);
}
function gameOver(){
  running=false;clearInterval(timer);stopMusic();statusEl.textContent="Game Over";
  setTimeout(()=>alert("🐍 Game Over! Score: "+score),50);
}
document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>setDir(b.dataset.d)));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp")setDir("up");if(e.key==="ArrowDown")setDir("down");
  if(e.key==="ArrowLeft")setDir("left");if(e.key==="ArrowRight")setDir("right");
  if(e.code==="Space"&&!running)start();
});
let sx=0,sy=0;
canvas.addEventListener("touchstart",e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
canvas.addEventListener("touchend",e=>{
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?"right":"left");else setDir(dy>0?"down":"up");
},{passive:true});
startBtn.addEventListener("click",start);
musicBtn.addEventListener("click",()=>{
  musicOn=!musicOn;
  musicBtn.textContent=musicOn?"🔊 Music ON":"🔇 Music OFF";
  if(musicOn){if(running)startMusic();}else stopMusic();
});
img.onload=draw;reset();
</script>
